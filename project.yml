# XcodeGen spec. The CI runner turns this into Ma.xcodeproj, so the project
# file never lives in git and nobody needs a Mac to change it.
name: Ma
options:
  bundleIdPrefix: com.sensei
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: L3XLH7XB8J
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Automatic, cloud-managed signing: on CI xcodebuild gets the App Store
    # Connect API key and fetches certificates and profiles from Apple itself.
    CODE_SIGN_STYLE: Automatic

targets:
  Ma:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Watch/Shared          # snapshot and command types, shared with the watch
    dependencies:
      - target: MaShieldConfig
      - target: MaShieldAction
      - target: MaMonitor
      - target: MaFilter
      - target: MaWidgets
      - target: MaReport
      - target: MaWatch
        embed: true
        codeSign: false             # the watch app is signed in its own build
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchPaper
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPhone-only, but App Store validation still checks the iPad keys.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # Focus sounds keep playing while the screen is locked.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sensei.ma
            CFBundleURLSchemes: [ma]
        LSApplicationQueriesSchemes: [instagram, youtube, twitter, linkedin, fb, reddit, snapchat, pinterest, barcelona, tiktok]
    entitlements:
      path: App/Ma.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sensei.ma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.ma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The screen iOS shows in place of a blocked app.
  MaShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfig
      - path: Shared
    info:
      path: Extensions/ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Ma Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sensei.ma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.ma.shieldconfig

  # What happens when somebody taps a button on that screen.
  MaShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
      - path: Shared
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Ma Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sensei.ma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.ma.shieldaction

  # Runs while the app is closed: schedules, expiring unlocks, focus end.
  MaMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Monitor
      - path: Shared
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: Ma Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    entitlements:
      path: Extensions/Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sensei.ma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.ma.monitor

  # Safari Web Extension that hides Reels, Shorts and endless feeds.
  MaFilter:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Filter/SafariWebExtensionHandler.swift
      - path: Extensions/Filter/Resources
        buildPhase: resources
      - path: Shared/MaShared.swift
      - path: Shared/FilterSettings.swift
      - path: Shared/Loc.swift
    info:
      path: Extensions/Filter/Info.plist
      properties:
        CFBundleDisplayName: Ma Filter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extensions/Filter/Filter.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sensei.ma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.ma.filter

  # Home Screen and Lock Screen widgets plus the focus Live Activity.
  MaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widgets
      # Only files that import Foundation or ActivityKit. Models.swift and
      # SharedStore.swift pull in FamilyControls and stay out.
      - path: Shared/MaShared.swift
      - path: Shared/Loc.swift
      - path: Shared/FocusActivity.swift
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ma Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sensei.ma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.ma.widgets

  # Draws the weekly Screen Time report inside the app. iOS runs it sealed
  # off: it may read usage data and draw it, but nothing leaves it.
  # An ExtensionKit extension: this extension point loads no NSExtension appex.
  MaReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Extensions/Report
      - path: Shared/Loc.swift
      - path: Shared/MaShared.swift
    info:
      path: Extensions/Report/Info.plist
      properties:
        CFBundleDisplayName: Ma Report
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: "XPC!"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: Extensions/Report/Report.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sensei.ma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.ma.report

  # Apple Watch companion: rings, breathing, focus remote. The phone keeps
  # the Screen Time shields; the watch only asks it to start or stop focus.
  MaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Ma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sensei.ma
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [mindfulness]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.ma.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
