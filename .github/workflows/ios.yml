name: iOS

# Public repo, so GitHub's macOS runners cost nothing. Every push compiles
# the app unsigned; signed builds only run when started by hand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "site/**", "gallery/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: "check = compile only, testflight = sign and upload, device = full build for registered iPhones, installed from GitHub Pages"
        type: choice
        options: [check, testflight, device]
        default: check
      screen_time:
        description: "With Screen Time (needs Apple's Family Controls approval). Off = preview build without app blocking."
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.lane || 'check' }}-${{ inputs.screen_time }}
  cancel-in-progress: true

jobs:
  content:
    name: Decks and web extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate decks
        run: python3 scripts/validate_decks.py
      - name: Validate gallery decks
        run: python3 gallery/build_index.py --check
      - name: Parse extension scripts
        run: |
          for f in Extensions/Filter/Resources/*.js; do node --check "$f"; done
          python3 -c "import json; json.load(open('Extensions/Filter/Resources/manifest.json'))"

  check:
    name: Compile (unsigned)
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'check'
    needs: content
    runs-on: macos-26
    # A hung xcodebuild once ate six hours of runner time elsewhere. Never again.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Ma.xcodeproj -scheme Ma \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            build | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }

  testflight:
    name: TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'testflight'
    needs: content
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Xcode $VERSION"
          if [ "${VERSION%%.*}" -lt 26 ]; then
            echo "::error::App Store Connect wants the iOS 26 SDK, which means Xcode 26 or later."
            exit 1
          fi
      - name: Check the secrets are there
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
      # altool looks in this folder by name; xcodebuild gets the path directly.
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      # Preview builds drop the Family Controls entitlement, which Apple only
      # signs for App Store builds once it has approved it for the app.
      - name: Preview without Screen Time
        if: ${{ !inputs.screen_time }}
        run: |
          sed -i '' '/com.apple.developer.family-controls: true/d' project.yml
          if grep -q family-controls project.yml; then echo "::error::entitlement still in project.yml"; exit 1; fi
          echo "EXTRA_SETTINGS=SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) MA_PREVIEW" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      # Cloud-managed signing: with the API key and -allowProvisioningUpdates,
      # Xcode creates or fetches the certificate and every profile itself.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Ma.xcodeproj -scheme Ma \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Ma.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${EXTRA_SETTINGS:+"$EXTRA_SETTINGS"} \
            archive | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Ma.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export
      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -1)
          test -n "$IPA" || { echo "::error::the export produced no ipa"; exit 1; }
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys

  # Development build with the full Screen Time entitlement. Apple grants
  # Family Controls to development builds without review, so this runs on
  # registered iPhones today. Installed over the air from GitHub Pages.
  device:
    name: Device build (GitHub Pages)
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'device'
    needs: content
    runs-on: macos-26
    timeout-minutes: 60
    # Shares the Pages deploy slot with pages.yml so they never overwrite
    # each other mid-deploy.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}install/
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      # One development certificate for every run, kept encrypted in the
      # Actions cache. Without it each fresh runner mints a new one and the
      # account hits Apple's certificate limit.
      - name: Check the bundle ids at Apple
        run: python3 ci/bundle_ids.py
      - name: Restore the development certificate
        uses: actions/cache/restore@v4
        with:
          path: ci/.signing
          key: ma-dev-cert-v1-${{ github.run_id }}
          restore-keys: ma-dev-cert-v1-
      - name: Install the development certificate
        id: devcert
        run: python3 ci/dev_cert.py
      - name: Keep a new development certificate
        if: steps.devcert.outputs.created == 'true'
        uses: actions/cache/save@v4
        with:
          path: ci/.signing
          key: ma-dev-cert-v1-${{ github.run_id }}
      - name: Leave the watch app out until its bundle id exists
        if: env.MA_SKIP_WATCH == '1'
        run: python3 ci/strip_watch.py
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      # Automatic signing picks the development certificate and creates
      # development profiles that include every registered device.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Ma.xcodeproj -scheme Ma \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Ma.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Ma.xcarchive \
            -exportOptionsPlist ci/ExportOptions-device.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export
      - name: Build the install page
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -1)
          test -n "$IPA" || { echo "::error::the export produced no ipa"; exit 1; }
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="https://${OWNER}.github.io/${{ github.event.repository.name }}/install"
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          BUILD=${{ github.run_number }}
          mkdir -p build/install
          cp "$IPA" build/install/Ma.ipa
          sips -z 57 57 App/Assets.xcassets/AppIcon.appiconset/icon-1024.png --out build/install/icon-57.png >/dev/null
          sips -z 512 512 App/Assets.xcassets/AppIcon.appiconset/icon-1024.png --out build/install/icon-512.png >/dev/null
          for f in manifest.plist index.html; do
            sed -e "s|__BASE__|$BASE|g" -e "s|__VERSION__|$VERSION|g" -e "s|__BUILD__|$BUILD|g" "ci/install/$f" > "build/install/$f"
          done
          echo "Install page: $BASE/"
      # The website deploys on its own (pages.yml); it picks up the newest
      # install page from this release asset instead of rebuilding the app.
      - name: Keep the install page for website-only deploys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf build/install.tar.gz -C build/install .
          if ! gh release view pages-install -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create pages-install -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Install page (device build)" \
              --notes "Not a release. Holds the newest device build's install page so the website can be redeployed without rebuilding the app."
          fi
          gh release upload pages-install build/install.tar.gz -R "$GITHUB_REPOSITORY" --clobber
      - name: Assemble the site
        run: python3 site/build.py _site --install build/install
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Remove the key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
