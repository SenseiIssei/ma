name: iOS

# Public repo, so GitHub's macOS runners cost nothing. Every push compiles
# the app unsigned; signed builds only run when started by hand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: "check = compile only, testflight = sign and upload"
        type: choice
        options: [check, testflight]
        default: check
      screen_time:
        description: "With Screen Time (needs Apple's Family Controls approval). Off = preview build without app blocking."
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.lane || 'check' }}-${{ inputs.screen_time }}
  cancel-in-progress: true

jobs:
  content:
    name: Decks and web extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate decks
        run: python3 scripts/validate_decks.py
      - name: Parse extension scripts
        run: |
          for f in Extensions/Filter/Resources/*.js; do node --check "$f"; done
          python3 -c "import json; json.load(open('Extensions/Filter/Resources/manifest.json'))"

  check:
    name: Compile (unsigned)
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'check'
    needs: content
    runs-on: macos-26
    # A hung xcodebuild once ate six hours of runner time elsewhere. Never again.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Ma.xcodeproj -scheme Ma \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            build | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }

  testflight:
    name: TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'testflight'
    needs: content
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Xcode $VERSION"
          if [ "${VERSION%%.*}" -lt 26 ]; then
            echo "::error::App Store Connect wants the iOS 26 SDK, which means Xcode 26 or later."
            exit 1
          fi
      - name: Check the secrets are there
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
      # altool looks in this folder by name; xcodebuild gets the path directly.
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      # Preview builds drop the Family Controls entitlement, which Apple only
      # signs for App Store builds once it has approved it for the app.
      - name: Preview without Screen Time
        if: ${{ !inputs.screen_time }}
        run: |
          sed -i '' '/com.apple.developer.family-controls: true/d' project.yml
          if grep -q family-controls project.yml; then echo "::error::entitlement still in project.yml"; exit 1; fi
          echo "EXTRA_SETTINGS=SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) MA_PREVIEW" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      # Cloud-managed signing: with the API key and -allowProvisioningUpdates,
      # Xcode creates or fetches the certificate and every profile itself.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Ma.xcodeproj -scheme Ma \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Ma.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${EXTRA_SETTINGS:+"$EXTRA_SETTINGS"} \
            archive | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Ma.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export
      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -1)
          test -n "$IPA" || { echo "::error::the export produced no ipa"; exit 1; }
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
