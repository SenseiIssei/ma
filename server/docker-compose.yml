# Example for the VPS. Only nginx on the same host can reach the port,
# because it is bound to 127.0.0.1.
services:
  ma-friends:
    build: .
    image: ma-friends:latest
    container_name: ma-friends
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      BASE_PATH: /ma/api
      DATA_DIR: /data
      # Put ADMIN_TOKEN in a .env file next to this one (never in git).
      # Leave it empty to switch the gallery review endpoints off.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TRUST_PROXY: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://senseiissei.dev}
      # Accounts: owners get the daily lessons and personal reminders.
      OWNER_EMAILS: ${OWNER_EMAILS:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # Confirmation and reset mails (the same SMTP as the DevPanel).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Reminder channels; linked per account from inside Ma.
      DAILY_SITE_ORIGIN: ${DAILY_SITE_ORIGIN:-https://senseiissei.dev}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # The compile sandbox for the daily lessons, see daily-runner below.
      RUNNER_URL: http://daily-runner:8096
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    networks: [default, runner]
    volumes:
      - ma-friends-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    mem_limit: 256m

  # Compiles and runs C++ for the daily lessons. No internet (internal
  # network), read-only except /tmp, capped memory, CPU and processes.
  # SYS_PTRACE lets LeakSanitizer stop the program's threads to look for
  # leaks; everything else is dropped.
  daily-runner:
    build: ./runner
    image: daily-runner:latest
    container_name: daily-runner
    restart: unless-stopped
    # tini as PID 1 collects the zombies of programs that fork.
    init: true
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    networks: [runner]
    read_only: true
    tmpfs:
      - /tmp:exec,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
      # Docker's default profile plus personality(ADDR_NO_RANDOMIZE), which
      # ThreadSanitizer needs on kernels with high mmap randomisation.
      - seccomp=./runner/seccomp.json
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5
    stop_grace_period: 5s

networks:
  runner:
    internal: true

volumes:
  ma-friends-data:
